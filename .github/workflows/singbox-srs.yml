name: Compile sing-box rule sets

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: SubPilot compilation job ID
        required: true
        type: string
      output_key:
        description: Stable rule-set output key
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: singbox-srs-${{ inputs.output_key }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out compiler script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/compile-singbox-srs.mjs
          sparse-checkout-cone-mode: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Compile and publish rule sets
        env:
          SUBPILOT_URL: ${{ secrets.SUBPILOT_URL }}
          SUBPILOT_SRS_SECRET: ${{ secrets.SUBPILOT_SRS_SECRET }}
          SUBPILOT_SRS_JOB_ID: ${{ inputs.job_id }}
          SUBPILOT_SRS_OUTPUT_KEY: ${{ inputs.output_key }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/compile-singbox-srs.mjs
