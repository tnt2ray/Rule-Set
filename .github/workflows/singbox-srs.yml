name: Compile SubPilot rule sets

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: SubPilot batch integration ID
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: actions-compiler-batch
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out compiler script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/compile-rule-sets.mjs
            scripts/actions-compiler-runtime.mjs
          sparse-checkout-cone-mode: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Compile and publish rule sets
        env:
          SUBPILOT_URL: ${{ secrets.SUBPILOT_URL }}
          SUBPILOT_ACTIONS_SECRET: ${{ secrets.SUBPILOT_ACTIONS_SECRET }}
          SUBPILOT_ACTIONS_JOB_ID: ${{ inputs.job_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/compile-rule-sets.mjs
