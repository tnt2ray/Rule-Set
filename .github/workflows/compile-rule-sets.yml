name: Compile SubPilot rule sets

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: SubPilot batch integration ID
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: actions-compiler-batch
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out compiler script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/compile-rule-sets.mjs
            scripts/actions-compiler-runtime.mjs
          sparse-checkout-cone-mode: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Compile and publish rule sets
        env:
          SUBPILOT_URL: ${{ secrets.SUBPILOT_URL }}
          SUBPILOT_ACTIONS_SECRET: ${{ secrets.SUBPILOT_ACTIONS_SECRET }}
          SUBPILOT_ACTIONS_JOB_ID: ${{ inputs.job_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/compile-rule-sets.mjs
